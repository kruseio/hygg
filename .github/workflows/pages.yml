# Publish the hygg-pwa to GitHub Pages, one immutable deploy per tag.
#
# The site accumulates rather than being replaced:
#
#   /hygg/            the latest release — the URL to share and install from
#   /hygg/0.1.22/     that tag, frozen; stays put so a link to it keeps working
#   /hygg/0.1.21/
#   /hygg/versions.html
#
# So the tag is built twice, at two public URLs. It is deliberately not one build
# plus a redirect at the root: a PWA's identity is its scope, so installing from
# a root that redirects would pin the installed app to whatever version it first
# saw. Building the root separately keeps one stable app identity there, with the
# pinned copies as siblings for anyone who needs a specific version.
#
# This uses a gh-pages branch instead of actions/deploy-pages because the latter
# replaces the whole site on every run, which would take the old versions with
# it. Enable it once under Settings → Pages → Source: "Deploy from a branch" →
# gh-pages / (root).

name: pages

on:
  # Bare semver, no `v` prefix — this repository tags 0.1.22. This read `v*`
  # until 2026-07, which matched no tag it has ever had, so no tag ever deployed
  # the site; what is published there came from the manual dispatch below.
  # `[0-9]+` is a GitHub filter pattern rather than a regex (`+` repeats the
  # preceding bracket group).
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # Rebuild the site (e.g. after changing the version index) without tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)deploy, e.g. 0.1.22"
        required: true
      ref:
        description: "Git ref to build from (default: the tag). Set to a branch like main to redeploy a tag from fixed sources after a build-tooling fix — the deploy still lands at the `tag` URLs, only the tree built changes."
        required: false
        default: ""

permissions:
  contents: write # pushes the built site to gh-pages

# Never let two tags interleave their read-modify-write of gh-pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy pwa
    runs-on: ubuntu-22.04
    steps:
      # Before the checkout, because it needs nothing from the tree and the tag
      # decides what the tree even is.
      #
      # The tag reaches half the `run:` scripts below, and GitHub substitutes
      # ${{ }} into a script before the shell parses it — double quotes stop
      # word splitting, they do not stop $( ) or backticks. A ref name may
      # contain both. The push trigger's filter happens to constrain
      # github.ref_name to digits and dots already; workflow_dispatch takes the
      # string as typed and constrains nothing. So the shape is checked once,
      # here, and every step downstream reads the checked value out of `env`
      # rather than pasting the raw one.
      - name: Resolve tag and base path
        id: vars
        env:
          TAG_IN: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          [[ "$TAG_IN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::'$TAG_IN' is not a bare-semver tag like 0.1.22"; exit 1; }
          echo "tag=$TAG_IN" >> "$GITHUB_OUTPUT"
          echo "base=/$REPO" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG_IN to /$REPO/ and /$REPO/$TAG_IN/"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: pages

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      # Two builds, two public URLs. Trunk bakes the public URL into the hashed
      # asset refs, so a build is not relocatable after the fact.
      # The `mv` targets are ../../: the working directory is two deep
      # (packages/hygg-pwa), and "Assemble site" below reads these from the
      # repository root.
      - name: Build latest (served at ${{ steps.vars.outputs.base }}/)
        working-directory: packages/hygg-pwa
        env:
          BASE: ${{ steps.vars.outputs.base }}
        run: |
          set -euo pipefail
          trunk build --release --public-url "$BASE/"
          python3 tools/prepare_pages_dist.py dist "$BASE/"
          mv dist ../../dist-latest

      - name: Build pinned (served at ${{ steps.vars.outputs.base }}/${{ steps.vars.outputs.tag }}/)
        working-directory: packages/hygg-pwa
        env:
          BASE: ${{ steps.vars.outputs.base }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          url="$BASE/$TAG/"
          trunk build --release --public-url "$url"
          python3 tools/prepare_pages_dist.py dist "$url"
          mv dist ../../dist-pinned

      # A fresh repo has no gh-pages yet; start it as an orphan so the branch
      # carries only the site, never the source history.
      - name: Check out gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add site --track -b gh-pages origin/gh-pages
          else
            echo "no gh-pages branch yet — creating it"
            git worktree add --orphan -b gh-pages site
          fi

      - name: Assemble site
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          BASE: ${{ steps.vars.outputs.base }}
        run: |
          set -euo pipefail

          # Replace the root deploy, keeping every pinned version dir. The tags
          # here are bare (0.1.22), so this has to match a leading digit — it
          # read `site/v[0-9].*` until 2026-07, from back when the trigger was
          # `v*`, and would have deleted every pinned directory this workflow
          # has ever written on the next deploy. An optional `v` so that any dir
          # left over from that era survives too. Anchored to a full X.Y.Z so a
          # root file like versions.html is not mistaken for a version
          # directory and preserved as stale; posix-extended because findutils'
          # default regex dialect wants `\?` for an optional atom. `main/` is
          # spared too — it is the continuously-deployed main channel that
          # pages-main.yml owns, not a stale root file.
          find site -mindepth 1 -maxdepth 1 \
            -regextype posix-extended \
            -not -name '.git' \
            -not -name 'main' \
            -not -regex 'site/v?[0-9]+\.[0-9]+\.[0-9]+.*' \
            -exec rm -rf {} +
          cp -R dist-latest/. site/

          # The pinned copy is immutable: re-tagging the same version replaces it,
          # anything else is left alone.
          rm -rf "site/$TAG"
          mkdir -p "site/$TAG"
          cp -R dist-pinned/. "site/$TAG/"

          # Install the SPA deep-link router as the site's single root 404 (Pages
          # serves it for every missing path): it forwards a hard-loaded
          # sub-route like /hygg/main/settings — and every deploy's sub-routes —
          # to the owning index, which restores the route. Written after the
          # copies above so it is not clobbered by dist-latest's own 404.html.
          # Guarded so redeploying a tag from before this file existed still
          # succeeds. See packages/hygg-pwa/tools/pages-404.html.
          if [ -f packages/hygg-pwa/tools/pages-404.html ]; then
            cp packages/hygg-pwa/tools/pages-404.html site/404.html
          fi

          # Pages runs Jekyll otherwise, which drops files starting with "_".
          touch site/.nojekyll
          python3 packages/hygg-pwa/tools/write_versions_index.py site "$BASE/"

      - name: Commit and push
        working-directory: site
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "site unchanged — nothing to push"
            exit 0
          fi
          git commit -m "pages: deploy $TAG"
          git push origin gh-pages

      - name: Summary
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          BASE: ${{ steps.vars.outputs.base }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "### PWA deployed"
            echo
            echo "- latest: https://$OWNER.github.io$BASE/"
            echo "- pinned: https://$OWNER.github.io$BASE/$TAG/"
            echo "- all versions: https://$OWNER.github.io$BASE/versions.html"
          } >> "$GITHUB_STEP_SUMMARY"
