# Build the hygg-server container image, and publish it to GHCR on a tag.
#
# Every pull request builds the image (amd64 only, never pushed) so a change that
# breaks the Dockerfile or the server's build fails here rather than at release
# time. A release tag builds linux/amd64 and linux/arm64 and pushes them as one
# multi-arch image — arm64 matters for a self-hosted server (Raspberry Pi, Oracle
# free tier, Graviton).
#
# Each architecture builds on a runner of its own architecture rather than under
# QEMU: emulating this dependency tree (axum, sea-orm, the bundled tract OCR
# engine) would take hours. That is why the tag path builds by digest and then
# stitches the digests into one manifest — the standard buildx pattern for
# distributing a multi-arch build across runners.

name: docker

on:
  # A release tag builds both arches and pushes the multi-arch image to GHCR.
  #
  # Bare semver, no `v` prefix: this repository tags 0.1.22. This read `v*` until
  # 2026-07 and therefore matched no tag this repository has ever had, so no
  # image was ever pushed on a release. `[0-9]+` is a GitHub filter pattern, not
  # a regex — `+` repeats the preceding bracket group.
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  # Scoped to pull requests into main, matching ci.yml. main was never a trigger
  # here, so the tag path is untouched by that change.
  pull_request:
    branches: [main]
  # Weekly cache warm, for the same reason as ci.yml: the buildx `type=gha` cache
  # below is branch-scoped exactly like a rust-cache entry, so with no run ever
  # landing on main, PR image builds would restore from a scope nothing refreshes.
  # A scheduled run is a branch ref, not a tag, so every `ref_type == 'tag'` guard
  # below turns it into precisely a cache warm: amd64 only, no GHCR login, no
  # push, no manifest merge. Only the amd64 scope is warmed, which is the one PRs
  # read; arm64 is built on tags alone.
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hygg-server
  # What the GHCR package page shows as the image description, sourced from
  # packages/hygg-server/README.md's summary. Applied as a per-arch label and
  # as an index annotation (GHCR reads a multi-arch image's metadata from the
  # index).
  DESCRIPTION: >-
    Self-hostable, multi-tenant sync server for the hygg reader. Sync
    documents, reading progress, bookmarks, highlights and notes across
    devices. Single Rust binary backed by SQLite.
  DOCS_URL: https://github.com/kruseio/hygg/blob/main/packages/hygg-server/README.md

# Read by default; the two jobs that push to GHCR re-grant themselves the
# `packages: write` they need. Without this, a job that declared no permissions
# would inherit the repository's default token scope, which can be write. The
# scheduled and pull-request runs of the build job below still carry
# `packages: write` because job permissions are static across triggers and the
# tag run of that same job pushes by digest — tightening that further means
# splitting the tag-only push into its own job, tracked separately.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Non-tag runs — pull requests, the weekly cache warm, manual dispatch — only
  # prove the image still builds and runs. They push nothing, so they hold no
  # registry token: this job is `contents: read` and never logs in to GHCR.
  # That is the whole reason the build is split in two rather than one job with
  # per-step `if`s — job permissions are static across triggers, so the only way
  # the scheduled path can be denied `packages: write` is for its work to live
  # in a job that never asks for it. amd64 only; arm64 is a tag-time concern.
  ci-build:
    name: build (amd64)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build (load, no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/hygg-server/Dockerfile
          platforms: linux/amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          # Load into the local daemon so the smoke test has something to run,
          # and push nowhere.
          load: true
          tags: hygg-server:ci

      - name: Smoke test
        env:
          REF: hygg-server:ci
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3032:3032 "$REF"
          ok=
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3032/health 2>/dev/null | grep -q '"ok"'; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::server never answered /health"
            docker logs smoke
            exit 1
          fi
          echo "health: ok"
          # The dependency /convert needs; absent, DOCX/ODT/RTF 500 at runtime.
          docker exec smoke pandoc --version | head -1
          docker stop smoke >/dev/null

  # Tag runs build both arches by digest and push them. This is the only build
  # job that holds `packages: write`, and it runs on tags alone.
  release-build:
    name: build (${{ matrix.arch }})
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — the tags are applied to the manifest, not to these
      # per-arch digests. org.opencontainers.image.source is what links the GHCR
      # package back to this repository. licenses/description are overridden:
      # the action's defaults derive them from the repository (whose detected
      # license is the reader's AGPL-3.0), which had the GHCR package page
      # advertising AGPL for a crate that ships under Elastic-2.0.
      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=hygg-server
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=Elastic-2.0
            org.opencontainers.image.documentation=${{ env.DOCS_URL }}

      # Cache scoped per arch: the two runners produce different layers, and a
      # shared scope would have them evicting each other on every run. The amd64
      # scope is the one ci-build warms and reads.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/hygg-server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Push the arch-specific layers unnamed, to be joined into a manifest
          # by the merge job below.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Compiling is not the same as running. The image previously shipped
      # without pandoc, which `/convert` shells out to, and the binary links
      # libssl at runtime — neither shows up in a build that merely succeeds. So
      # start the thing and ask it. Each runner is native to the image it built,
      # so it can execute it directly.
      - name: Smoke test
        env:
          REF: ${{ format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3032:3032 "$REF"
          ok=
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3032/health 2>/dev/null | grep -q '"ok"'; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::server never answered /health"
            docker logs smoke
            exit 1
          fi
          echo "health: ok"
          # The dependency /convert needs; absent, DOCX/ODT/RTF 500 at runtime.
          docker exec smoke pandoc --version | head -1
          docker stop smoke >/dev/null

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # The digest names the file; its contents are irrelevant. Stripping the
          # "sha256:" prefix has to happen in the shell — GitHub expressions have
          # no such operator.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the per-arch digests into one tagged multi-arch image, so `docker pull`
  # resolves to the right architecture on its own.
  merge:
    name: publish manifest
    needs: release-build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.1.22 -> :0.1.22, :0.1, and :latest. metadata-action parses semver with
      # or without a `v`, so the bare tags this repository uses need nothing
      # special here. `latest=auto` leaves a pre-release (1.0.0-rc1) off :latest,
      # which is the point of tagging one.
      # `annotations` (index level) is what GHCR actually reads for a
      # multi-arch image's description and license on the package page — the
      # per-arch labels above only cover single-platform pulls. Same override
      # rationale as the build job: without it the page shows the repository's
      # AGPL-3.0 instead of the server's Elastic-2.0.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=auto
          annotations: |
            org.opencontainers.image.title=hygg-server
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.licenses=Elastic-2.0
            org.opencontainers.image.documentation=${{ env.DOCS_URL }}

      # Args are built as an array because tag values are trivially word-safe
      # but annotation values contain spaces — the old inline $(jq ... join)
      # would split them.
      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do
            args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${args[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ steps.meta.outputs.version }}"
            echo '```'
            echo
            echo "Tags: ${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
