# Build + test the non-native crates: the `hygg` CLI, the `hygg-server` sync
# backend, and the `hygg-pwa` wasm frontend. The native app bundles (Tauri
# desktop/mobile) are built separately in native-apps.yml, which is slower and
# needs per-OS system webviews.

name: ci

on:
  # A v* tag still runs: release.yml publishes from it, and now that main is not
  # a trigger, a tag can carry commits no pull request ever saw. It is the last
  # gate before anything ships.
  push:
    tags: ["v*"]
  # The gate. A pull_request build checks out the *merge result* of head into
  # base, so a green PR has already tested what main is about to become —
  # re-running the identical tree on push to main spends a three-OS matrix to
  # learn nothing. It also means a commit pushed straight to main runs no
  # pipeline at all, which is deliberate: that is the escape hatch for a README
  # typo, and the reason to keep it for changes that cannot break a build.
  pull_request:
    branches: [main]
  # Weekly cache warm, on main. An Actions cache is only restorable from the
  # branch that saved it or from the default branch, so once main stopped
  # building on every merge, nothing refreshed the scope every PR restores from —
  # and each PR would have rebuilt this dependency tree from close to scratch.
  #
  # It is a schedule on *this* workflow rather than a cache-warm workflow of its
  # own because rust-cache derives its key from the job id: a separate workflow
  # would faithfully populate keys that no PR ever reads. A scheduled run lands on
  # the default branch, so these jobs save under exactly the keys PRs restore.
  # Weekly is deliberate — an entry is evicted after 7 days unattended, and if one
  # does lapse this run simply rebuilds and re-saves it, on nobody's critical path.
  # It doubles as a canary that main still builds when no PR has touched it.
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The CLI is the crate users `cargo install`, so it is built and tested on all
  # three desktop OSes — its terminal/PTY and file-path handling is exactly the
  # code that diverges per platform.
  cli:
    name: hygg cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The ODT/DOCX tests shell out to pandoc and silently skip themselves when
      # it is absent, so without this they would pass while testing nothing.
      - name: Install pandoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install pandoc (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc

      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y --no-progress

      - name: Verify pandoc is on PATH
        run: pandoc --version

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: cli-${{ matrix.os }}

      # cli-epub-to-text is built explicitly: the EPUB test shells out to
      # target/debug/cli-epub-to-text by path, and `-p hygg` does not build a
      # sibling crate's binary. Locally it is usually present from an earlier
      # workspace build, which is why this only ever failed in CI.
      - name: Build
        run: cargo build -p hygg -p cli-epub-to-text --locked

      - name: Test
        run: cargo test -p hygg --locked

  # The full suite, on one platform. The `cli` matrix above runs only `-p hygg`'s
  # tests and `server` below only `-p hygg-server`'s, which left most of the
  # workspace with no CI coverage at all — cli-text-reader above all, the reader
  # engine and the largest body of tests in the tree. Cross-platform divergence is
  # the matrix's job; this one is about breadth, so it runs once, on Linux.
  #
  # The member selection mirrors tools/ci.sh's HOST_ONLY, and drifts from it at
  # your peril: the two verbatim upstream forks are not ours to test, hygg-pwa's
  # real artifact is the wasm bundle the `pwa` job builds (its host build is a
  # trunk launcher), and hygg-tauri needs that bundle on disk before it will
  # compile at all — native-apps.yml is what covers it.
  tests:
    name: full test suite (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Same reason as the cli job: the ODT/DOCX tests skip themselves silently
      # when pandoc is absent, and would pass while testing nothing.
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Verify pandoc is on PATH
        run: pandoc --version

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: tests

      - name: Test
        run: |
          cargo test --workspace --locked \
            --exclude hygg-cff-parser --exclude hygg-pdf-extract \
            --exclude hygg-pwa --exclude hygg-tauri

  # Self-hostable sync server. Tests are SQLite-backed, so no service container
  # is needed.
  server:
    name: hygg-server
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: server

      - name: Build
        run: cargo build -p hygg-server --locked

      - name: Test
        run: cargo test -p hygg-server --locked

  # The PWA's real artifact is the wasm bundle, so it is built the way it ships:
  # through Trunk for wasm32-unknown-unknown. A host `cargo build -p hygg-pwa`
  # would only compile the thin trunk launcher and prove nothing about the app.
  pwa:
    name: hygg-pwa (wasm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: pwa

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Build wasm bundle
        working-directory: hygg-pwa
        run: trunk build --release

      - uses: actions/upload-artifact@v4
        with:
          name: hygg-pwa-dist
          path: hygg-pwa/dist
