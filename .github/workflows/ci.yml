# Every gate tools/ci.sh runs, on every pull request into main — one leg per job,
# so a red build names the check that failed rather than a script that stopped
# somewhere inside itself, and so the slow legs run beside each other instead of
# queueing behind the fast ones.
#
# These jobs call tools/ci.sh rather than spelling out the cargo invocations
# again. The member exclusions and flags are subtle enough (read that script's
# header) that a second copy of them here would drift, and the drift would
# surface as a pull request that is green on a runner and red on a laptop — this
# file had already started down that road, carrying a comment that its exclusion
# list "mirrors tools/ci.sh's HOST_ONLY, and drifts from it at your peril".
#
# What no runner runs is tools/ci-mutable.sh, the maintainer's local pass —
# cargo update / cargo upgrade / cargo fix, and then these same legs over the
# result. Those steps rewrite the tree, and a gate that rewrites the tree has
# stopped testing the one that was proposed; that split is why ci.sh is two
# files. `fmt` is the same thought from the other end: the leg checks, the local
# pass writes.
#
# The native app bundles (Tauri desktop/mobile installers) are built separately
# in native-apps.yml, which is slower and needs per-OS system webviews.

name: ci

on:
  # The only gate, and deliberately the only thing that fires here. A
  # pull_request build checks out the *merge result* of head into base, so a
  # green PR has already tested what main is about to become — re-running the
  # identical tree on push to main spends a three-OS matrix to learn nothing.
  #
  # Neither a push to main nor a release tag runs this suite. Pushing straight to
  # main is meant to run no pipeline at all, and a tag is meant to build and ship
  # artifacts, not to re-litigate the tree: on a tag, release.yml (installers),
  # publish.yml (crates.io), docker.yml (the GHCR image) and pages.yml (the PWA
  # deploy) are the whole story. A tag can therefore carry commits no pull
  # request ever saw — that is the trade this repository accepts, and the reason
  # to tag a commit that went through one.
  pull_request:
    branches: [main]
  # Weekly cache warm, on main. An Actions cache is only restorable from the
  # branch that saved it or from the default branch, so once main stopped
  # building on every merge, nothing refreshed the scope every PR restores from —
  # and each PR would have rebuilt this dependency tree from close to scratch.
  #
  # It is a schedule on *this* workflow rather than a cache-warm workflow of its
  # own because rust-cache derives its key from the job id: a separate workflow
  # would faithfully populate keys that no PR ever reads. A scheduled run lands on
  # the default branch, so these jobs save under exactly the keys PRs restore.
  # Weekly is deliberate — an entry is evicted after 7 days unattended, and if one
  # does lapse this run simply rebuilds and re-saves it, on nobody's critical path.
  # It doubles as a canary that main still builds when no PR has touched it, and
  # now also the one place cargo audit's advisory scan is read as news rather
  # than noise (see the audit job).
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:

# One live run per ref. A pull request now fans out to ten jobs, so a second push
# arriving mid-flight would otherwise leave two full sets competing for runners
# to answer a question only the newer one is still asking. The weekly schedule
# gets a group but never cancels: it is on nobody's critical path and has nothing
# to race with.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Gates that compile nothing ---------------------------------------------
  # Seconds, not minutes, and no cache to restore. They fail a malformed pull
  # request while the compiled legs below are still linking.

  # Nightly is not a preference here: rustfmt.toml leans on `ignore` — the only
  # thing keeping the vendored forks unformatted — and on `wrap_comments`, both
  # nightly-only options that stable rustfmt drops with a warning while
  # reformatting the forks it was asked to leave alone.
  fmt:
    name: fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # tools/ci.sh pins the toolchain and the leg below invokes it by name, so
      # ask the script which one to install rather than naming a version here
      # too. Two copies of a version string are two copies that drift.
      - id: toolchain
        run: echo "v=$(./tools/ci.sh toolchain nightly)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.v }}
          components: rustfmt
      - run: ./tools/ci.sh fmt

  # No toolchain at all: the gate is `git ls-files` and `wc -l`.
  loc-gate:
    name: loc gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/ci.sh loc

  # Reports; does not gate. It is the one leg here that cannot, because its input
  # is not the pull request — it is the advisory database, which moves on its own
  # schedule. An advisory published overnight against a transitive dependency
  # would turn every open pull request red while having found nothing wrong with
  # any of them, and the contributor holding the red X would be the one person
  # unable to fix it. It is also not quite the check ci-mutable.sh runs locally:
  # there, audit follows cargo update/upgrade and so judges a freshly resolved
  # tree, while here it judges the committed lockfile, advisories and all.
  #
  # So it runs on pull requests for its annotation, and the weekly scheduled run
  # above is where it is read as news. When it is loud, fix it on a branch of its
  # own rather than inside whatever pull request happened to be open.
  audit:
    name: audit (advisory report)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: ./tools/ci.sh audit

  # --- Gates that compile ------------------------------------------------------
  # Pinned throughout, and pinned in tools/ci.sh rather than here: each job below
  # asks the script which toolchain its leg wants, so the version has one home.
  #
  # The note that used to sit here said a floating nightly's cost was that a new
  # lint could redden an untouched tree, and to pin the date if that ever blocked
  # real work. It did — clippy grew chunks_exact_to_as_chunks the night 0.1.23
  # was tagged and took clippy, wasm and tauri down with it, over one line nobody
  # had touched. Stable now runs everything that can run on stable, which is
  # every leg but fmt and udeps; tools/ci.sh has the why for those two.

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "v=$(./tools/ci.sh toolchain stable)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (pinned stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.v }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: clippy
      - run: ./tools/ci.sh clippy

  # The full suite, on one platform, and the only job here that tests breadth.
  # Until it existed CI ran `-p hygg` and `-p hygg-server` and nothing else, so
  # most of the workspace had no coverage at all — cli-text-reader above all, the
  # reader engine and the largest body of tests in the tree. Cross-platform
  # divergence is the `cli` matrix's job; this one runs once, on Linux, and
  # subsumes what the old separate `hygg-server` job did (its tests are
  # SQLite-backed, so no service container is needed here either).
  tests:
    name: full test suite (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The ODT/DOCX tests shell out to pandoc and silently skip themselves when
      # it is absent, so without this they would pass while testing nothing.
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Verify pandoc is on PATH
        run: pandoc --version

      - id: toolchain
        run: echo "v=$(./tools/ci.sh toolchain stable)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (pinned stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.v }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: tests

      - run: ./tools/ci.sh test

  # The TTS regression tests, which the suite above compiles out — the feature is
  # opt-in, so the default run builds none of it and guards none of it. Its own
  # job for the same reason it is its own leg: espeak-rs builds vendored espeak-ng
  # through CMake and rodio links ALSA, so this is the only job here that needs
  # system packages for a *cargo* dependency rather than a test fixture.
  tts:
    name: tts tests
    # 24.04, unlike the rest: ort downloads a prebuilt onnxruntime that is linked
    # against glibc 2.38+, which 22.04 (2.35) cannot satisfy.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake + ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev

      - id: toolchain
        run: echo "v=$(./tools/ci.sh toolchain stable)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (pinned stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.v }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: tts

      - run: ./tools/ci.sh tts

  # Nightly, of necessity: cargo-udeps passes -Z flags. Pinned all the same.
  udeps:
    name: udeps
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        run: echo "v=$(./tools/ci.sh toolchain nightly)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.v }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: udeps
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps
      - run: ./tools/ci.sh udeps

  # --- Gates ci.sh has no way to run -------------------------------------------

  # The CLI is the crate users `cargo install`, so its terminal/PTY and file-path
  # handling — exactly the code that diverges per platform — is built and tested
  # on the OSes where it diverges. This is the one job here that is not a ci.sh
  # leg and could not be: the script runs on one machine, and this exists for the
  # other two. Stable, not nightly, for the same reason — stable is what a user
  # installing hygg will have. Linux is absent because the `tests` job above
  # already runs `-p hygg` there as part of the full suite, on the same runner
  # image; this matrix exists for the divergence, not a third copy of one result.
  cli:
    name: hygg cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The ODT/DOCX tests shell out to pandoc and silently skip themselves when
      # it is absent, so without this they would pass while testing nothing.
      - name: Install pandoc (macOS)
        if: runner.os == 'macOS'
        run: brew install pandoc

      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc -y --no-progress

      - name: Verify pandoc is on PATH
        run: pandoc --version

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: cli-${{ matrix.os }}

      # cli-epub-to-text is built explicitly: the EPUB test shells out to
      # target/debug/cli-epub-to-text by path, and `-p hygg` does not build a
      # sibling crate's binary. Locally it is usually present from an earlier
      # workspace build, which is why this only ever failed in CI.
      - name: Build
        run: cargo build -p hygg -p cli-epub-to-text --locked

      - name: Test
        run: cargo test -p hygg --locked

  # --- The two crates the host legs exclude ------------------------------------

  # The PWA's real artifact is the wasm bundle, so it is built the way it ships:
  # through Trunk for wasm32-unknown-unknown. A host `cargo build -p hygg-pwa`
  # would only compile the thin trunk launcher and prove nothing about the app —
  # which is why the host legs exclude it and this leg exists. It also carries the
  # isolation guard, so this job is where `cargo install hygg` is held to a
  # dependency tree free of the Leptos/wasm and native-GUI stacks.
  pwa:
    name: hygg-pwa (wasm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Both toolchains, wasm32 on each: this leg lints and builds on stable and
      # then runs udeps, which is nightly-only. Install order carries no meaning
      # here — the Trunk build used to inherit whichever toolchain landed last as
      # the default, and now takes the pin from tools/ci.sh through
      # RUSTUP_TOOLCHAIN like every other command in the leg.
      - id: toolchain-nightly
        run: echo "v=$(./tools/ci.sh toolchain nightly)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (pinned nightly + wasm, for udeps)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain-nightly.outputs.v }}
          targets: wasm32-unknown-unknown

      - id: toolchain-stable
        run: echo "v=$(./tools/ci.sh toolchain stable)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (pinned stable + wasm)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain-stable.outputs.v }}
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: pwa

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - run: ./tools/ci.sh wasm

      - uses: actions/upload-artifact@v4
        with:
          name: hygg-pwa-dist
          path: packages/hygg-pwa/dist

  # hygg-tauri's lint and test pass, which nothing else does. native-apps.yml
  # builds this app's installers on all three desktop OSes, but building is all it
  # does — it never lints the crate, and it never runs the tests covering the
  # native extraction commands (base64 decode, the txt/pdf/epub pipeline), which
  # live here and nowhere else. Debug profile, Linux only, against a Trunk bundle:
  # whether the app bundles on Windows and macOS is native-apps.yml's question,
  # and this job deliberately does not re-ask it.
  tauri:
    name: hygg-tauri (lint + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The WebKitGTK stack Tauri links against on Linux — the same set
      # native-apps.yml installs, and needed here before hygg-tauri will compile
      # at all.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      # wasm32 is required alongside the host target: the leg builds the hygg-pwa
      # frontend before hygg-tauri, whose generate_context! embeds the bundle.
      - id: toolchain
        run: echo "v=$(./tools/ci.sh toolchain stable)" >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (pinned stable + wasm)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.v }}
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: tauri

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - run: ./tools/ci.sh tauri
