    <!-- SPA deep-link restore. GitHub Pages has one 404 per site, so a hard
         load of a client-side route (…/main/settings) is answered by the root
         404 (tools/pages-404.html), which forwards it to the owning deploy's
         real index as …/main/?/settings. Undo that encoding here — before the
         WASM router reads the URL — so the address bar and router see the
         intended path. A no-op for every ordinary load (no leading "?/"). -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var route = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          history.replaceState(null, null, l.pathname.slice(0, -1) + route + l.hash);
        }
      })(window.location);
    </script>

    <!-- Relative, not root-absolute: the versioned Pages deploys serve this
         bundle from /hygg/v<tag>/, where a leading "/" would escape the deploy.
         These resolve against <base href> (injected per deploy by
         tools/prepare_pages_dist.py), or against the document at "/" when there
         is no base — the Tauri shell and a plain `trunk serve`. -->

    <script>
      // Capture the install prompt so the in-app banner can trigger it later.
      window.__hyggDeferredPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.__hyggDeferredPrompt = e;
        window.dispatchEvent(new Event("hygg:installable"));
      });
      window.__hyggInstall = async () => {
        const e = window.__hyggDeferredPrompt;
        if (!e) return "unavailable";
        e.prompt();
        const choice = await e.userChoice;
        window.__hyggDeferredPrompt = null;
        return choice.outcome;
      };
      window.addEventListener("appinstalled", () => {
        window.__hyggDeferredPrompt = null;
      });
      // Register the service worker for offline support — but not inside the
      // Tauri shell, where the bundle is already local (served over a custom
      // protocol) so a SW is pointless and its registration can error.
      if ("serviceWorker" in navigator && !window.__TAURI__) {
        window.addEventListener("load", () => {
          // Relative: resolves against <base href>, which both points at this
          // deploy's own sw.js and scopes it to this deploy — so /hygg/ and
          // /hygg/v0.1.21/ get independent workers instead of one stomping the
          // other's cache.
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
