[package]
name = "cli-epub-to-text"
description = "A CLI epub to plain text converter"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT"
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[dependencies]
# Read the container/OPF spine directly: epub 2.1.5 pins vulnerable zip 3.
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
percent-encoding = "2.3"
html2text = "0.17"
hygg-shared = { version = "0.1", path = "../hygg-shared" }

[dev-dependencies]
# Builds legacy-charset chapters for tests/encodings.rs (already in the tree via
# hygg-shared).
encoding_rs = "0.8"
tempfile = "3"
