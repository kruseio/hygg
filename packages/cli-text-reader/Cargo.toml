[package]
name = "cli-text-reader"
description = "A less like CLI text reader"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[features]
default = []
# Local Kokoro TTS narration. Opt-in like the `ocr` feature: the default build
# (and `cargo install hygg`) pulls none of these. `ort` downloads an ONNX
# Runtime binary at build time; `espeak-rs` vendors espeak-ng and builds it
# with CMake (needs a C toolchain). The model itself is downloaded on first
# use, not bundled (it is far too large for crates.io).
tts = [
  "dep:ort",
  "dep:espeak-rs",
  "dep:ndarray",
  "dep:ndarray-npy",
  "dep:rodio",
  "dep:sha2",
]

[dependencies]
cli-justify = { version = "0.1", path = "../cli-justify" }
cli-pdf-to-text = { version = "0.1", path = "../cli-pdf-to-text" }
hygg-shared = { version = "0.1", path = "../hygg-shared" }

getopts = "0.2"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", features = ["json"] }

# Same versions as cli-justify, so the cursor column is measured exactly the way
# the justified layout is.
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

arboard = { version = "3", default-features = true, features = ["wayland-data-control"] }

# --- TTS (feature = "tts") ---
# Pinned exactly because ort is still in release candidates and breaks its API
# between them. Moved from the Phase 0 spike's rc.11 to rc.15 on 2026-10-30; the
# only change needed was the explicit, once-per-process `Environment` (see
# `environment()` in speech/kokoro/engine.rs). ndarray-npy reads the voices .bin
# (an NPZ).
ort = { version = "=2.0.0-rc.15", optional = true }
espeak-rs = { version = "0.2.0", optional = true }
ndarray = { version = "0.17", optional = true }
ndarray-npy = { version = "0.10", optional = true }
rodio = { version = "0.23", optional = true }
# Verifies the downloaded model/voices against a pinned digest. Already in the
# lock via hygg-shared, so this adds no new crate.
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"
