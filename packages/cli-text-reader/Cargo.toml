[package]
name = "cli-text-reader"
description = "A less like CLI text reader"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[features]
default = []
# Local Kokoro TTS narration. Opt-in like `pdf-ocr-bundled`: the default build
# (and `cargo install hygg`) pulls none of these. `ort` downloads an ONNX
# Runtime binary at build time; `espeak-rs` vendors espeak-ng and builds it
# with CMake (needs a C toolchain). The model itself is downloaded on first
# use, not bundled (it is far too large for crates.io).
tts = ["dep:ort", "dep:espeak-rs", "dep:ndarray", "dep:ndarray-npy", "dep:rodio"]

[dependencies]
cli-justify = { version = "0.1", path = "../cli-justify" }
cli-pdf-to-text = { version = "0.1", path = "../cli-pdf-to-text" }
hygg-shared = { version = "0.1", path = "../hygg-shared" }

getopts = "0.2"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", features = ["json"] }

arboard = { version = "3", default-features = true, features = ["wayland-data-control"] }

# --- TTS (feature = "tts") ---
# Pinned to the exact ort release the Phase 0 spike validated, since the
# inference code targets this API. ndarray-npy reads the voices .bin (an NPZ).
ort = { version = "=2.0.0-rc.11", optional = true }
espeak-rs = { version = "0.2.0", optional = true }
ndarray = { version = "0.17", optional = true }
ndarray-npy = { version = "0.10", optional = true }
rodio = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
