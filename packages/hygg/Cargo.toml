[package]
name = "hygg"
description = "Simplifying the way you read"
default-run = "hygg"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[features]
default = []
# Opt-in engines. Neither is compiled into the default build (`cargo install
# hygg`); pass the feature to compile it in, which also flips that engine's
# runtime default (HYGG_OCR / HYGG_TTS) to on. The models themselves are always
# downloaded on first use and cached, never bundled.
ocr = ["cli-pdf-to-text/ocr"]
tts = ["cli-text-reader/tts"]
full = ["ocr", "tts"]

[[test]]
name = "integration_test"
path = "tests/integration_test/main.rs"

[dependencies]
cli-pdf-to-text = { version = "0.1", path = "../cli-pdf-to-text" }
cli-epub-to-text = { version = "0.1", path = "../cli-epub-to-text" }
cli-justify = { version = "0.1", path = "../cli-justify" }
cli-text-reader = { version = "0.1", path = "../cli-text-reader" }
redirect-stderr = { version = "0.1", path = "../redirect-stderr" }
hygg-shared = { version = "0.1", path = "../hygg-shared" }

uuid = { version = "1", features = ["v4"] }

clap = { version = "4.6", features = ["derive"] }
