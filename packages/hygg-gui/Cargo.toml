[package]
name = "hygg-gui"
description = "hygg reader — native iced desktop GUI (Windows, Linux, macOS), offline-first"
publish = false

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
readme = "README.md"
repository.workspace = true

# A native iced desktop reader (Windows, Linux, macOS): `cargo run -p hygg-gui`.
# It reuses the exact hygg extraction/justification pipeline the CLI and PWA use,
# so a document looks the same everywhere. Nothing in the published `hygg`
# crate's tree references it, so `cargo install hygg` never pulls iced/wgpu —
# same isolation as hygg-pwa and hygg-server. (The browser reader is hygg-pwa.)

[lints]
workspace = true

[lib]
name = "hygg_gui"

[[bin]]
name = "hygg-gui"
path = "src/main.rs"

[dependencies]
# Reused hygg pipeline — the actual "hygg look" + offline formats.
cli-justify = { version = "0.1", path = "../cli-justify" }
cli-epub-to-text = { version = "0.1", path = "../cli-epub-to-text" }
# `visual-assets` unlocks full-resolution embedded images + rasterized table
# regions for the reader's "Images" mode. It's a pure render-layer addition —
# the flattened text/anchor model is untouched, so progress still interops with
# every other client.
cli-pdf-to-text = { version = "0.1", path = "../cli-pdf-to-text", features = [
  "visual-assets",
] }
hygg-shared = { version = "0.1", path = "../hygg-shared" }

# The GUI toolkit, rendered on wgpu (GPU). `advanced` unlocks rich_text (colored
# ANSI-art spans); `fira-sans` bundles the default UI font; `svg` renders the top
# bar / card line icons (tinted to the palette); `image` renders raster figures
# and tables in the reader; `tokio` is the async runtime for `Task::perform`.
iced = { version = "0.13", default-features = false, features = [
  "advanced",
  "fira-sans",
  "svg",
  "image",
  "wgpu",
  "tokio",
] }

# Async file picker + save dialog (AppKit / GTK / Win32).
rfd = "0.15"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unicode text segmentation (UAX #29) for browser-style double-click word
# selection in the custom text field.
unicode-segmentation = "1"

# Optional server sync (progressive enhancement). The wire DTOs come from
# hygg-shared, shared with the CLI/PWA/server.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
uuid = { version = "1", features = ["v4"] }

# Per-user data / config directories for the offline library store.
directories = "5"

# Decode + circular-mask GitHub avatars for the Credits page (fetched via
# reqwest, rendered as iced RGBA image handles). 0.25 is already in the tree
# (cli-pdf-to-text / cli-image-to-ascii), so this pulls nothing new.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }

# Windows-only build dependency: embed a VERSIONINFO resource into hygg-gui.exe
# (see build.rs) so the file's Properties → Details tab shows the version,
# publisher, copyright, and commit — the Windows equivalent of the macOS "About"
# panel. `cfg(windows)` on build-deps matches the *host*, i.e. the Windows box
# that has the resource compiler; on macOS/Linux hosts it's never pulled and the
# build.rs code path is compiled out.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
