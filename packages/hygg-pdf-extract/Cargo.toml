[package]
name = "hygg-pdf-extract"
description = "Thin fork of pdf-extract 0.10.0 wired to hygg-cff-parser (panic fix for Adobe Expert-encoded CFF fonts). Internal to hygg."
# Tracks the hygg release train rather than upstream's 0.10.0 so it republishes
# alongside the rest of the workspace. Based on pdf-extract 0.10.0; see README.
version.workspace = true
edition = "2018"
authors = [
  "Jeff Muizelaar <jmuizelaar@mozilla.com>",
  "kruseio",
]
license = "MIT"
repository = "https://github.com/kruseio/hygg"
readme = "README.md"
keywords = ["pdf2text", "text", "pdf", "pdf2txt"]
include = [
  "src/**/*",
  "README.md",
  "LICENSE",
]

[lib]
name = "pdf_extract"
path = "src/lib.rs"

[dependencies]
adobe-cmap-parser = "0.4.1"
# The whole reason this fork exists: redirect pdf-extract's `cff-parser`
# dependency to our patched copy. The dependency key stays `cff-parser` so the
# upstream source keeps compiling unchanged (`use cff_parser::...`).
cff-parser = { package = "hygg-cff-parser", version = "0.1", path = "../hygg-cff-parser" }
encoding_rs = "0.8.34"
euclid = "0.20.5"
log = "0.4.22"
lopdf = { version = "0.44", default-features = false }
postscript = "0.14"
type1-encoding-parser = "0.1.0"
unicode-normalization = "0.1.19"
