[package]
name = "cli-pdf-to-text"
description = "A CLI pdf to plain text converter"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT"
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[features]
default = []
pdf-rendering = ["pdf_oxide/rendering"]
# Scanned-PDF OCR via pdf_oxide's pure-Rust tract backend. The ONNX models are
# NOT bundled: they are downloaded on first use from this project's own
# `ocr-models-v1.0` GitHub release, verified against a pinned sha256, and cached
# under the platform cache dir — mirroring the TTS model fetch in cli-text-reader
# (ureq fetches, sha2 verifies, dirs resolves the cache path). Native-only.
ocr = ["pdf-rendering", "pdf_oxide/ocr-tract", "dep:ureq", "dep:sha2", "dep:dirs"]
# High-fidelity visual extraction for a rich GUI (full-resolution embedded
# images + rasterized table regions), exposed via `pdf_bytes_to_visuals`. It
# enables pdf_oxide's rasterizer for table regions but DELIBERATELY does not
# turn on this crate's `pdf-rendering` feature, so page composition — and thus
# every client's line/kind/anchor model — stays byte-identical. Native only.
visual-assets = ["pdf_oxide/rendering"]

[dependencies]
cli-image-to-ascii = { version = "0.1", path = "../cli-image-to-ascii" }
cli-justify = { version = "0.1", path = "../cli-justify" }
hygg-shared = { version = "0.1", path = "../hygg-shared" }

getopts = "0.2"

# pdf_oxide is the streaming-path backend. It parses PDFs lazily — opening
# the 31 MB / 1310-page pdfreference1.7old.pdf takes ~100 ms instead of the
# ~40 s lopdf + pdf-extract need to parse and decompress every content
# stream up-front. Per-page extraction stays fast (sub-ms warm) and the
# document handle is `Send + Sync`, so we can keep the existing
# `Arc<PdfStream>` + background loader thread architecture unchanged.
# lopdf + pdf-extract are still used by the non-streaming `pdf_to_text`
# path, which trades latency for better layout fidelity on TOC / tables.
# pdf_oxide ships explicit wasm32 support (its own getrandom/web-sys target
# deps), so the streaming path is the one that compiles for the browser PWA.
#
# Pinned to =0.3.70: every release from 0.3.71 onwards (re-verified against
# 0.3.77) hangs indefinitely extracting pdfreference1.7old.pdf — pathological
# deep recursion in pdf_oxide's structure-tree parser
# (parse_struct_elem/parse_k_children re-parsing objects without memoization).
# 0.3.70 is the last release before the regression and passes the full stream
# test suite. It is also the earliest release to require quick-xml 0.41, which
# is what takes this tree off the vulnerable quick-xml 0.40 (RUSTSEC-2026-0194
# / RUSTSEC-2026-0195) — so the pin cannot be lowered either. The `=` pin is
# deliberate so `cargo update` / CI's `cargo upgrade` can't silently
# re-introduce the hang; widen it once upstream fixes the blowup. Repro:
# cli-pdf-to-text stream test `toc_section_labels_stay_separate`.
pdf_oxide = { version = "=0.3.70", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png"] }

# --- OCR model fetch (feature = "ocr") ---
# The OCR ONNX models are downloaded on first use and cached, rather than
# embedded via include_bytes!. Only pulled in with the `ocr` feature, which is
# native-only (the wasm PWA never enables it), so ureq/sha2/dirs never reach the
# browser build.
ureq = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }
dirs = { version = "6", optional = true }

# Native-only backend for the non-streaming `pdf_to_text` layout path. These
# don't build for wasm32 (rayon needs threads; redirect-stderr uses libc
# dup/dup2; lopdf/pdf-extract are the up-front parser). The browser PWA uses
# only the pdf_oxide streaming path (`PdfStream::open_bytes`), so we target-gate
# them off wasm to keep that build lean and buildable.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redirect-stderr = { version = "0.1", path = "../redirect-stderr" }
# Upstream pdf-extract. This was a pair of in-tree forks (hygg-pdf-extract on
# hygg-cff-parser) until 0.12 shipped: the forks existed only to stop
# cff-parser's `panic!()` on Adobe Expert-encoded CFF fonts crashing extraction
# of Adobe-generated PDFs, and 0.12 depends on cff-parser 0.2, which implements
# that encoding properly instead of panicking on it.
pdf-extract = "0.12"
# Held to pdf-extract's own lopdf requirement so the workspace links one lopdf
# rather than two. `pdf_extract::Document` is a re-export of `lopdf::Document`;
# nothing here passes one across that boundary today, but a version mismatch
# would quietly make the two spellings different types the moment something did.
lopdf = "0.42"
rayon = "1"
