    <script>
      // Capture the install prompt so the in-app banner can trigger it later.
      window.__hyggDeferredPrompt = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.__hyggDeferredPrompt = e;
        window.dispatchEvent(new Event("hygg:installable"));
      });
      window.__hyggInstall = async () => {
        const e = window.__hyggDeferredPrompt;
        if (!e) return "unavailable";
        e.prompt();
        const choice = await e.userChoice;
        window.__hyggDeferredPrompt = null;
        return choice.outcome;
      };
      window.addEventListener("appinstalled", () => {
        window.__hyggDeferredPrompt = null;
      });
      // Register the service worker for offline support — but not inside the
      // Tauri shell, where the bundle is already local (served over a custom
      // protocol) so a SW is pointless and its registration can error.
      if ("serviceWorker" in navigator && !window.__TAURI__) {
        window.addEventListener("load", () => {
          // Relative: resolves against <base href>, which both points at this
          // deploy's own sw.js and scopes it to this deploy — so /hygg/ and
          // /hygg/v0.1.21/ get independent workers instead of one stomping the
          // other's cache.
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
