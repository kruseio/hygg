# One-command self-host:  docker compose up --build -d
# Run from this directory (hygg-server/). One service, no database to run
# alongside it — data is a SQLite file persisted in ./data.

services:
  hygg-server:
    build:
      context: ..
      dockerfile: hygg-server/Dockerfile
    image: hygg-server:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:///app/data/hygg-server.db
      LOG_DIR: /app/data/logs
      RUST_LOG: hygg_server=info,tower_http=info
    # PORT comes from .env (via env_file above and Compose's own interpolation),
    # so changing it there moves both the published and in-container port.
    ports:
      - "${PORT:-3032}:${PORT:-3032}"
    volumes:
      - ./data:/app/data

