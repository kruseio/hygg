[package]
name = "cli-pdf-to-text"
description = "A CLI pdf to plain text converter"

version.workspace = true
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[dependencies]
redirect-stderr = { version = "0.1", path = "../redirect-stderr" }
hygg-shared = { version = "0.1", path = "../hygg-shared" }

getopts = "0.2"

# Pinned to 0.7 until upstream cff-parser stops panicking on the
# 32 MB pdfreference1.7old.pdf fixture (0.8+ pulled in cff-parser 0.1
# which has an explicit panic in encoding.rs).
pdf-extract = "0.7"
lopdf = "0.40"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[dev-dependencies]
rayon = "1"
